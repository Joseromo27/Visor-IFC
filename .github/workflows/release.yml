name: Publicar instaladores

# Los instaladores de macOS y Linux no se pueden generar desde Windows, asi que
# el release completo se arma aqui. Este workflow tambien produce el latest.json
# firmado que consume tauri-plugin-updater.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}-${{ matrix.rust-targets }}

      # webkit2gtk provee el WebView en Linux; el resto son dependencias del
      # empaquetado a .deb y .AppImage.
      - name: Dependencias de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - run: npm ci

      # Con createUpdaterArtifacts activo, una clave de firma ausente o mal
      # copiada hace fallar el build entero, y el error que sale no dice que el
      # problema sean los secretos. Esto lo deja claro de entrada, sin revelar
      # los valores: solo longitud y si arrastran espacios o saltos de linea,
      # que es como se cuelan al copiarlos con la terminal.
      - name: Verificar secretos de firma
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          fallo=0
          if [ -z "$KEY" ]; then
            echo "::error::Falta el secreto TAURI_SIGNING_PRIVATE_KEY"
            fallo=1
          else
            echo "TAURI_SIGNING_PRIVATE_KEY presente: ${#KEY} caracteres"
            # La clave que genera Tauri es una sola linea en base64; el texto
            # "untrusted comment" solo aparece al decodificarla, asi que
            # buscarlo en crudo da un falso negativo. Se valida la forma.
            limpia="$(printf '%s' "$KEY" | tr -d '[:space:]')"
            case "$limpia" in
              *[!A-Za-z0-9+/=]*)
                echo "::error::La clave no es base64: contiene caracteres que no corresponden. Copia el archivo visor-ifc.key completo."
                fallo=1 ;;
              *)
                if [ "${#limpia}" -lt 100 ]; then
                  echo "::error::La clave parece truncada (${#limpia} caracteres). Se esperan varios cientos."
                  fallo=1
                else
                  echo "  forma correcta: base64 de ${#limpia} caracteres"
                fi ;;
            esac
          fi

          if [ -z "$PASS" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD vacio (correcto solo si la clave no tiene contrasena)"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD presente: ${#PASS} caracteres"
            recortado="$(printf '%s' "$PASS" | tr -d '[:space:]')"
            if [ "${#recortado}" -ne "${#PASS}" ]; then
              echo "::error::La contrasena arrastra espacios o saltos de linea (${#PASS} caracteres frente a ${#recortado} sin espacios). Vuelve a copiarla sin el salto final."
              fallo=1
            fi
          fi

          exit $fallo

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sin esta clave el updater no puede verificar la firma y rechaza la
          # actualizacion. Se genera con `npm run tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Visor IFC __VERSION__'
          releaseBody: |
            Instaladores del Visor IFC.

            - Windows: `.msi` o `.exe` (instalacion por usuario, no requiere administrador)
            - macOS: `.dmg`
            - Linux: `.AppImage` o `.deb`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
